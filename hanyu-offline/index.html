<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5a4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="汉语单词本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>汉语单词本</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#fdfcfa; --fg:#25302c; --muted:#6c7771; --line:#e1e0d8;
  --hanzi:#2b5a4b; --pinyin:#c4512f; --tile:#f1f0e9; --hl:#fbe9a6; --accent:#2b5a4b; --accent-fg:#fff;
  --warn:#b57a10; --bar:#e9e8e0;
  --f-body:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-han:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141917; --panel:#1d2421; --fg:#e4e8e5; --muted:#97a39c; --line:#33403b;
  --hanzi:#8fd1b8; --pinyin:#f09a7a; --tile:#27302c; --hl:#6b5a14; --accent:#8fd1b8; --accent-fg:#10201a; --warn:#e0b04a; --bar:#2a3430;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
#app{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:19px;margin:0 0 10px}
h2{font-size:15px;margin:22px 0 8px}
.muted{color:var(--muted)} .small{font-size:12.5px}
button{font:inherit;color:inherit}
input,select{font:inherit;color:var(--fg)}
/* 하단 탭 */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;border:0;background:none;padding:10px 4px 9px;font-size:12.5px;color:var(--muted);cursor:pointer}
nav button b{display:block;font:600 19px/1.2 var(--f-han)}
nav button[aria-current="page"]{color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
/* 검색 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px}
#q{width:100%;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
#q:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.count{font-size:13px;color:var(--muted);margin:8px 0 6px;min-height:20px}
/* 단어 카드 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:11px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hz{font:600 32px/1.15 var(--f-han);color:var(--hanzi)}
.tr{font:400 18px var(--f-han);color:var(--muted)}
.py{color:var(--pinyin);font-size:17px;margin:2px 0 0}
.lab{font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:11px 0 2px}
.mean{margin:0;font-size:16px;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--tile);color:var(--muted)}
.tag.hsk{color:var(--hanzi)}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{background:var(--tile);border-radius:8px;padding:7px 12px;min-width:80px}
.tile .a{font:600 22px var(--f-han);color:var(--hanzi)} .tile .b{font:400 14px var(--f-han);color:var(--muted);margin-left:4px}
.tile .c{font-size:13px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:34px 8px;text-align:center;color:var(--muted)}
/* 복습 */
.counts{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;color:var(--muted);font-size:13.5px;margin:2px 0 12px}
.counts b{color:var(--fg);font-variant-numeric:tabular-nums}
.rv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 14px;text-align:center}
.q{font-size:13px;color:var(--muted)}
.prompt{font:600 clamp(2.6rem,12vw,4.2rem)/1.15 var(--f-han);color:var(--hanzi);margin:14px 0 18px;overflow-wrap:anywhere}
.prompt.ko{font-family:var(--f-body);font-size:clamp(1.6rem,6vw,2.3rem);font-weight:700;color:var(--fg)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{font-weight:600;padding:12px 22px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn.sec{background:transparent;color:var(--fg);border-color:var(--line);font-weight:500}
.btn.sm{padding:7px 13px;font-size:13px}
.btn:focus-visible,.rate:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rv .card{text-align:left;margin:16px 0 0}
.ratings{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.rate{font-weight:600;min-height:54px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer}
.rate small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.rate.r1{border-color:var(--pinyin);color:var(--pinyin)} .rate.r2{border-color:var(--warn);color:var(--warn)}
.rate.r3,.rate.r4{border-color:var(--accent);color:var(--accent)}
/* 설정·통계 */
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)}
.row label{flex:1 1 150px}
.row select,.row input[type=number]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;color:var(--hanzi);font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:3px;height:96px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.warn{background:var(--tile);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"><main class="wrap" id="view"></main></div>
<nav aria-label="화면 선택">
  <button data-tab="dict"><b>词</b>단어장</button>
  <button data-tab="review"><b>习</b>복습</button>
  <button data-tab="stats"><b>统</b>통계·설정</button>
</nav>
<script src="vendor/ts-fsrs.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
